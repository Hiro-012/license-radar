[project]
name = "license-radar"

version = "0.1.11"

description = "Scan project dependency manifests for license compliance risk (GPL/AGPL/LGPL exposure) before it becomes a legal problem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "license-radar" }]
keywords = ["license", "compliance", "sca", "dependencies", "security", "gpl", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Hiro-012/license-radar"
Repository = "https://github.com/Hiro-012/license-radar"
Issues = "https://github.com/Hiro-012/license-radar/issues"

[project.scripts]
license-radar = "license_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["license_radar"]
