[project]
name = "license-radar"

version = "0.1.26"

description = "Scan project dependency manifests for license compliance risk (GPL/AGPL/LGPL exposure) before it becomes a legal problem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HiroCheck" }]
keywords = [
    "license",
    "license-compliance",
    "license-checker",
    "compliance",
    "sca",
    "software-composition-analysis",
    "dependencies",
    "dependency-license",
    "copyleft",
    "gpl",
    "agpl",
    "lgpl",
    "spdx",
    "security",
    "audit",
    "pre-commit",
    "ci",
    "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Hiro-012/license-radar"
Repository = "https://github.com/Hiro-012/license-radar"
Issues = "https://github.com/Hiro-012/license-radar/issues"

[project.scripts]
license-radar = "license_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["license_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
